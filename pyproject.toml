[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvbench"
version = "0.1.0"
description = "Measure what a caller actually hears from a telephony voice agent: pacing, continuity and barge-in latency over AudioSocket."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tahir Almas", email = "tahir@ictinnovations.com" }]
maintainers = [{ name = "ICT Innovations", email = "tahir@ictinnovations.com" }]
keywords = ["asterisk", "audiosocket", "voice-agent", "benchmark", "telephony", "latency", "barge-in", "voip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://www.ictinnovations.com/"
Source = "https://github.com/ictinnovations/telephony-voice-agent-benchmark"
Issues = "https://github.com/ictinnovations/telephony-voice-agent-benchmark/issues"

[project.scripts]
tvbench = "tvbench.cli:main"

[tool.setuptools]
packages = ["tvbench"]
