name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Import every module
        run: python -c "from tvbench import audiosocket, tone, harness, metrics, reference_agent, cli; print('imports ok')"
      - name: Falsification pass, every reference defect must move its metric
        run: python scripts/validate.py
      - name: Assert the matrix actually discriminates
        run: python scripts/assert_validation.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
